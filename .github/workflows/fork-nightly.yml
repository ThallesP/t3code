name: Fork nightly

# This fork's own nightly. The `nightly` branch is an upstream nightly plus the fork's changes
# (.github/fork/sync-upstream.sh keeps it merged). Every push builds it for the machines the fork
# runs on and publishes a prerelease, which installs of the fork update from like any nightly.
# Upstream already tested the commit it is based on, so this runs no test suite of its own.

on:
  push:
    branches: [nightly]
  workflow_dispatch:

# A run publishes a version higher than every earlier one, so runs never overlap. The single
# pending slot keeps only the newest push, which is the only one worth building.
concurrency:
  group: fork-nightly
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  meta:
    name: Resolve version
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      clerk_publishable_key: ${{ steps.public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.public_config.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      # Upstream numbers its nightlies with its own run number, a few thousand so far. The offset
      # keeps a fork version from ever naming an upstream build of the same day.
      - id: release_meta
        name: Resolve release version
        run: |
          node scripts/resolve-nightly-release.ts \
            --date "$(date -u +%Y%m%d)" \
            --run-number "$((900000 + GITHUB_RUN_NUMBER))" \
            --sha "$GITHUB_SHA" \
            --github-output

      # The public identifiers of upstream's production relay and sign-in, which .env.example tracks.
      - id: public_config
        name: Resolve T3 Connect public config
        run: |
          env_example() { sed -n "s|^T3CODE_$1=||p" .env.example; }
          {
            echo "clerk_publishable_key=$(env_example CLERK_PUBLISHABLE_KEY)"
            echo "clerk_jwt_template=$(env_example CLERK_JWT_TEMPLATE)"
            echo "clerk_cli_oauth_client_id=$(env_example CLERK_CLI_OAUTH_CLIENT_ID)"
            echo "relay_url=$(env_example RELAY_URL)"
          } >> "$GITHUB_OUTPUT"

  # The same steps as release.yml's build_bundle, which release-desktop.yml's jobs expect.
  build_bundle:
    name: Build JS bundle
    needs: [meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.meta.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.meta.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.meta.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.meta.outputs.relay_url }}
      # Mods are built from this version's tag in the repository that released it.
      T3CODE_SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.meta.outputs.version }}"

      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop:bundle

      # upload-artifact skips hidden paths; release-desktop.yml moves this file back.
      - name: Stage web asset manifest
        run: cp apps/server/dist/client/.vite/manifest.json apps/server/dist/client/vite-manifest.release.json

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [meta, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.meta.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.meta.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.meta.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.meta.outputs.relay_url }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true

  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [meta, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.meta.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.meta.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.meta.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.meta.outputs.relay_url }}
      label: macOS arm64
      runner: macos-26
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      launch_check: true

  # macOS installs an update only when it is signed by the identity that signed the running app.
  # The fork has no Apple Developer ID, so one self-signed certificate signs every build. The
  # build job packaged an unsigned app; this signs it and rewrites the files that describe it.
  sign_mac:
    name: Sign macOS app
    needs: [meta, desktop_mac_arm64]
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/fork

      - name: Download macOS build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-mac-arm64
          path: release-assets

      - name: Sign the app
        env:
          FORK_MAC_CERTIFICATE_P12: ${{ secrets.FORK_MAC_CERTIFICATE_P12 }}
          FORK_MAC_CERTIFICATE_PASSWORD: ${{ secrets.FORK_MAC_CERTIFICATE_PASSWORD }}
        run: .github/fork/sign-macos-release.sh release-assets

      - name: Upload signed macOS build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-mac-arm64
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [meta, desktop_linux_x64, sign_mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - name: Download Linux build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-linux-x64
          path: release-assets

      - name: Download signed macOS build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-mac-arm64
          path: release-assets

      - name: Download all CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # Servers verify the archive they update to against this file.
      - name: Write CLI archive checksums
        working-directory: release-assets
        run: |
          rm -f builder-debug.yml
          sha256sum t3-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # A draft has no tag and its files are not public, so installs see the release only once
      # every file is attached.
      - name: Publish release
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --draft --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "${{ needs.meta.outputs.release_name }}" \
            --notes "Fork build of \`${GITHUB_SHA:0:12}\`: an upstream nightly plus this fork's changes."
          gh release edit "$RELEASE_TAG" --draft=false

      # Each release is about 700 MB. Tags stay, because a mod is built from its version's tag.
      - name: Delete releases older than the newest 15
        run: |
          gh release list --limit 200 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-nightly\\.")))] | .[15:] | .[].tagName' \
            | while read -r tag; do gh release delete "$tag" --yes; done
